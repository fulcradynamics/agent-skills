name: ClawHub publish

# Publishes the two OpenClaw packages to ClawHub. Run it from the Actions tab.
# It defaults to a dry run; a real publish is only allowed from main, so every
# listing records a commit that is on main.
#
# The version comes from each package's openclaw.plugin.json (CI keeps it equal
# to the other platform manifests). ClawHub rejects a version it already has,
# so bump the manifests before publishing again.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; nothing is uploaded
        type: boolean
        default: true
      changelog:
        description: Release notes shown on ClawHub
        type: string
        default: ""

permissions:
  contents: read

env:
  OWNER: fulcra
  CLAWHUB: npx -y clawhub@0.23.3

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - path: .
            name: "@fulcra/fulcra-skills"
          - path: plugins/fulcra-mcp
            name: "@fulcra/fulcra-mcp"
    steps:
      - name: Refuse real publishes outside main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "Real publishes must run from main (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Log in to ClawHub
        if: ${{ !inputs.dry_run }}
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "The CLAWHUB_TOKEN repository secret is not set."
            exit 1
          fi
          $CLAWHUB login --token "$CLAWHUB_TOKEN"

      - name: Validate
        run: $CLAWHUB package validate "${{ matrix.path }}" --out "$RUNNER_TEMP/reports"

      - name: Publish ${{ matrix.name }}
        env:
          PKG_PATH: ${{ matrix.path }}
          PKG_NAME: ${{ matrix.name }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          version=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$PKG_PATH/openclaw.plugin.json")
          args=(package publish "$PKG_PATH"
            --family bundle-plugin
            --name "$PKG_NAME"
            --owner "$OWNER"
            --version "$version"
            --source-repo "$GITHUB_REPOSITORY"
            --source-commit "$GITHUB_SHA"
            --source-ref "$GITHUB_REF_NAME")
          if [ "$PKG_PATH" != "." ]; then args+=(--source-path "$PKG_PATH"); fi
          if [ -n "$CHANGELOG" ]; then args+=(--changelog "$CHANGELOG"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); else args+=(--wait); fi
          echo "clawhub ${args[*]}"
          $CLAWHUB "${args[@]}"
